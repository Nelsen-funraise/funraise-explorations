<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>睿鏡 PeakLens</title>
<meta name="description" content="God's Eye View × FUNRAISE MCP：台北不動產即時上帝視角（CesiumJS 版，PickPeak Design System）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23030712%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%2316A4C0%27 stroke-width=%272.5%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273.5%27 fill=%27%23FCBE83%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body class="d-balanced">
<div id="stage">
  <div id="cesiumContainer" aria-label="台北 3D 不動產地圖" role="img"></div>
  <div id="vignette"></div><div id="scan"></div>
  <div id="overlay" aria-hidden="true"></div>
  <div id="loading"><div class="spinner"></div><div class="eyebrow">PEAKLENS · BOOT</div><div id="loadmsg">載入台北 3D 建物…</div></div>

  <header id="topbar">
    <div class="brand"><span class="name">睿鏡 <em>PeakLens</em></span><span class="sub">by PickPeak · FUNRAISE MCP · v2</span></div>
    <nav id="lenses" class="lenses" aria-label="視角"></nav>
    <div class="status">
      <div id="density" class="density" role="group" aria-label="HUD 密度"></div>
      <button id="sun" class="pill" title="日照與陰影：選時刻或播放一天" aria-pressed="false">☀ 日照</button>
      <button id="share" class="pill" title="複製這個視角的連結（含鏡、年份、主題、圖層）">⤴ 分享</button>
      <button id="theme" class="pill" title="切換主題：夜間戰情室 / PickPeak 日間（N）">☀︎ 日間</button>
      <button id="mcpstat" class="down" title="FUNRAISE MCP 連線狀態"><i></i><span>FUNRAISE MCP · 快照</span></button>
      <span id="datastamp"></span><span id="clock" class="mono">--:--:-- TPE</span>
    </div>
  </header>

  <div id="readout" aria-live="polite"><span class="eyebrow">LENS</span><span class="line">正在載入…</span><span class="coords"></span></div>

  <button id="edge-l" class="edgetab" aria-label="展開資料面板"><span class="lbl">面板</span><span class="cnt"></span></button>
  <button id="edge-r" class="edgetab" aria-label="展開圖層與相機"><span class="lbl">圖層</span><span class="cnt"></span></button>

  <aside id="rail" class="panel" aria-label="圖層與相機">
    <div class="rail-group"><h4><span class="eyebrow">圖層 · Layers</span></h4><div id="layers" class="layer-list"></div></div>
    <div class="rail-group"><h4><span class="eyebrow">相機 · Perspective</span></h4><div id="modes" class="seg"></div></div>
    <div class="rail-group"><h4><span class="eyebrow">感測 · Sensor</span></h4><div id="sensors" class="seg"></div></div>
    <div class="rail-group"><h4><span class="eyebrow">底圖 · Basemap</span></h4><div id="basemaps" class="seg"></div></div>
    <div class="hint">左鍵拖曳平移 · 滾輪縮放 · 中鍵／Ctrl 拖曳旋轉俯仰 · 點選物件 · 雙擊飛過去 · <kbd>/</kbd> 指令 <kbd>D</kbd> 密度 <kbd>O</kbd> 環繞 <kbd>S</kbd> 街景 <kbd>C</kbd> 俯視 <kbd>T</kbd> 時光 <kbd>L</kbd> 換鏡 <kbd>1</kbd>–<kbd>4</kbd> 感測</div>
  </aside>

  <aside id="inspector" class="panel" aria-label="資料面板">
    <div><div class="eyebrow">LENS · 目標客群</div><h3 id="lens-title">—</h3><div id="lens-who" class="meta"></div></div>
    <div id="lens-kpis" class="kpis"></div>
    <div id="analysis" class="sect hidden"></div>
    <div id="callouts" class="sect hidden"></div>
    <div id="selection" class="hidden"></div>
    <div id="provenance" class="sect hidden"></div>
  </aside>

  <div id="gimbal" class="panel" aria-label="相機控制">
    <div id="compass" title="拖曳旋轉方位 · 點 N 回正北"><svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="29" fill="none" stroke="currentColor" stroke-opacity=".35"/><g id="compass-rose"><path d="M32 6 L38 32 L32 30 Z" fill="var(--blue-500)"/><path d="M32 58 L26 32 L32 34 Z" fill="currentColor" fill-opacity=".45"/><path d="M6 32 L32 26 L30 32 Z M58 32 L32 38 L34 32 Z" fill="currentColor" fill-opacity=".25"/></g><text x="32" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" font-family="Inter, sans-serif">N</text></svg></div>
    <div class="grows">
      <div class="gcol"><button id="g-tilt-up" title="抬高視角（↑）">⤒</button><input id="g-tilt" type="range" min="2" max="90" step="1" value="55" aria-label="俯角" title="俯角"><button id="g-tilt-down" title="壓低視角（↓）">⤓</button></div>
      <div class="gcol"><button id="g-zoom-in" title="拉近（+）">+</button><button id="g-2d" title="正俯視 / 3D 切換">2D</button><button id="g-zoom-out" title="拉遠（−）">−</button></div>
      <div class="gcol"><button id="g-rot-l" title="左轉（←）">↺</button><button id="g-north" title="回正北（Home）">N</button><button id="g-rot-r" title="右轉（→）">↻</button></div>
    </div>
  </div>
  <div id="cinebar" class="panel hidden"><div class="eyebrow" id="cine-title">SCENE</div><div id="cine-text"></div></div>
  <div id="caption" class="panel"><div class="head"><span class="eyebrow">睿鏡 · 回答</span><span id="caption-prov"></span></div><div id="caption-text"></div></div>

  <div id="console">
    <div id="suggest"></div>
    <div id="transcript" aria-live="polite"></div>
    <div id="timeline"><span class="now">2012</span><input id="year" type="range" min="2012" max="2030" step="1" value="2026" aria-label="年份時間軸"><span class="now">2030</span><span id="yearlbl" class="yr">2026</span></div>
    <div id="cmdbar">
      <button id="mic" title="語音輸入（zh-TW）" aria-label="語音輸入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="cmd" type="text" placeholder="對城市說話：「帶我去信義計畫區」「2028 年南港會長出什麼」「切到標註模式」…" autocomplete="off">
      <button id="orb" title="決策之心：agent 狀態" aria-label="agent 狀態"></button>
      <button id="tts" title="語音回覆／場景旁白" aria-pressed="true">🔈</button>
      <button id="agentmode" title="切換內建 agent / Claude 模式（需 server）" aria-pressed="false">內建</button>
      <button id="scenes" title="電影式場景">▶ 場景</button>
      <button id="send">送出</button>
    </div>
    <div id="mobilebar"><button id="m-layers">圖層／相機</button><button id="m-insp">面板</button><button id="m-tour">場景</button></div>
  </div>
  <div id="scenemenu" class="hidden"></div>
  <div id="toast" role="status"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
