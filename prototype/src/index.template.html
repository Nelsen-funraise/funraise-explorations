<title>PeakLens 睿鏡</title>
<meta name="description" content="God's Eye View × FUNRAISE MCP：台灣不動產的即時上帝視角原型。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--INLINE:style.css-->
<div id="stage">
  <canvas id="map" class="sensor-normal" aria-label="台北即時不動產地圖（互動畫布）" role="img"></canvas>
  <div id="vignette"></div><div id="scan"></div>

  <header id="topbar">
    <div class="brand"><span class="name">睿鏡 <em>PeakLens</em></span><span class="sub">God's Eye View × FUNRAISE MCP · Taiwan</span></div>
    <nav id="lenses" class="lenses" aria-label="視角"></nav>
    <div class="status"><span class="live"><i></i><span id="mcpstat">FUNRAISE MCP</span></span><span id="datastamp"></span><span id="clock" class="mono">--:--:-- TPE</span></div>
  </header>

  <div id="readout" aria-live="polite"><span class="eyebrow">LENS</span><span class="line">正在載入…</span><span class="coords"></span></div>

  <aside id="rail" aria-label="圖層與相機">
    <div class="rail-group"><h4><span class="eyebrow">圖層 · Layers</span></h4><div id="layers" class="layer-list"></div></div>
    <div class="rail-group"><h4><span class="eyebrow">相機 · Perspective</span></h4><div id="modes" class="seg"></div></div>
    <div class="rail-group"><h4><span class="eyebrow">感測 · Sensor</span></h4><div id="sensors" class="seg"></div></div>
    <div class="hint">拖曳平移 · 滾輪縮放 · 右鍵／Shift 拖曳旋轉俯仰 · <kbd>/</kbd> 指令 · <kbd>O</kbd> 環繞 <kbd>S</kbd> 街景 <kbd>C</kbd> 俯視 <kbd>T</kbd> 時光 <kbd>L</kbd> 換鏡 · <kbd>1</kbd>–<kbd>4</kbd> 感測</div>
  </aside>

  <aside id="inspector" aria-label="檢視面板">
    <div><div class="eyebrow">LENS · 目標客群</div><h3 id="lens-title">—</h3><div id="lens-who" class="meta"></div></div>
    <div id="lens-kpis" class="kpis"></div>
    <div id="analysis" class="hidden"></div>
    <div id="selection" class="hidden"></div>
  </aside>

  <div id="console">
    <div id="suggest"></div>
    <div id="transcript" aria-live="polite"></div>
    <div id="timeline"><span class="now">2012</span><input id="year" type="range" min="2012" max="2030" step="1" value="2026" aria-label="年份時間軸"><span class="now">2030</span><span id="yearlbl" class="yr">2026</span></div>
    <div id="cmdbar">
      <button id="mic" title="語音輸入（zh-TW）" aria-label="語音輸入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="cmd" type="text" placeholder="對地圖說話：「帶我去信義計畫區」「2028 年南港會長出什麼」「最近半年上市公司買了什麼」…" autocomplete="off">
      <button id="tts" title="語音回覆" aria-pressed="false">🔈</button>
      <button id="tour" title="90 秒自動導覽" aria-pressed="false">▶ 導覽</button>
      <button id="send">送出</button>
    </div>
    <div id="mobilebar"><button id="m-layers">圖層／相機</button><button id="m-insp">面板</button><button id="m-tour">導覽</button></div>
  </div>
  <div id="toast" role="status"></div>
</div>
<!--DATA:basemap-->
<!--DATA:demo-->
<!--INLINE:engine.js-->
<!--INLINE:agent.js-->
<!--INLINE:ui.js-->
